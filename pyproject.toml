[project]
name = "brain-llm-sae-robustness"
version = "0.1.0"
description = "Robustness study of SAE-based brain-LLM encoding results"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "transformers>=4.40",
    "transformer-lens>=2.0",
    "sae-lens>=3.0",
    "himalaya>=0.4",
    "nibabel>=5.1",
    "datasets>=2.18",
    "h5py>=3.10",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "huggingface-hub>=0.23",
]

[tool.uv]
# Pin 3.12: numpy miscomputes large arrays on 3.14 (lesson from the Cornell project).
